# ChessGenome — srv742144.hstgr.cloud
# Install: sudo cp nginx-chessgenome.conf /etc/nginx/sites-available/chessgenome
#          sudo ln -sf /etc/nginx/sites-available/chessgenome /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream chessgenome_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name srv742144.hstgr.cloud 82.25.69.91;

    # Frontend static build
    root /home/ubuntu/ChessGenome/chessgenome-frontend/dist;
    index index.html;

    client_max_body_size 32m;

    # API → NestJS
    location /api/ {
        proxy_pass http://chessgenome_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/chessgenome.access.log;
    error_log  /var/log/nginx/chessgenome.error.log;
}

