<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="system-ui, -apple-system, sans-serif">
  <!-- Fondo -->
  <rect width="720" height="480" fill="#ffffff"/>

  <!-- Título -->
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">L₁₀-Rekordkarte auf Start</text>

  <!-- Tarjeta (mock) -->
  <rect x="140" y="70" width="440" height="280" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Valor L10 -->
  <text x="360" y="135" text-anchor="middle" font-size="38" font-weight="700" fill="#ff6b00" font-family="ui-monospace, monospace">4521.5678</text>

  <!-- Cifras -->
  <text x="360" y="165" text-anchor="middle" font-size="13" fill="#6b7280">(~4522 Ziffern)</text>

  <!-- Etiqueta -->
  <text x="360" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#374151" letter-spacing="0.5">HÖCHSTES REGISTRIERTES L₁₀ MIT ZUGEHÖRIGER LEGALER PARTIE</text>

  <!-- Botones -->
  <rect x="200" y="245" width="130" height="34" rx="8" fill="#ff6b00" fill-opacity="0.15" stroke="#ff6b00"/>
  <text x="265" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#ff6b00">Position anzeigen</text>

  <rect x="350" y="245" width="130" height="34" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="415" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Autor anzeigen</text>

  <!-- Anotación 1: valor -->
  <line x1="360" y1="115" x2="620" y2="115" stroke="#888" stroke-dasharray="3 3"/>
  <circle cx="630" cy="115" r="11" fill="#2563eb"/>
  <text x="630" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>

  <!-- Anotación 2: cifras -->
  <line x1="360" y1="165" x2="620" y2="165" stroke="#888" stroke-dasharray="3 3"/>
  <circle cx="630" cy="165" r="11" fill="#2563eb"/>
  <text x="630" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>

  <!-- Anotación 3: etiqueta -->
  <line x1="360" y1="210" x2="620" y2="210" stroke="#888" stroke-dasharray="3 3"/>
  <circle cx="630" cy="210" r="11" fill="#2563eb"/>
  <text x="630" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>

  <!-- Anotación 4: ver posición -->
  <line x1="265" y1="262" x2="120" y2="330" stroke="#888" stroke-dasharray="3 3"/>
  <circle cx="115" cy="333" r="11" fill="#2563eb"/>
  <text x="115" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>

  <!-- Anotación 5: ver autor -->
  <line x1="415" y1="280" x2="470" y2="335" stroke="#888" stroke-dasharray="3 3"/>
  <circle cx="475" cy="338" r="11" fill="#2563eb"/>
  <text x="475" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>

  <!-- Leyenda explicativa -->
  <g font-size="12" fill="#111">
    <circle cx="30" cy="400" r="9" fill="#2563eb"/>
    <text x="30" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
    <text x="50" y="404">Maximales L₁₀, erreichbar mit legalen FIDE-Zügen</text>

    <circle cx="30" cy="424" r="9" fill="#2563eb"/>
    <text x="30" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
    <text x="50" y="428">Ungefähre Ziffernanzahl der Gödelzahl S</text>

    <circle cx="30" cy="448" r="9" fill="#2563eb"/>
    <text x="30" y="452" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
    <text x="50" y="452">Zählt nur Partien mit zugehörigem PGN in MongoDB</text>

    <circle cx="370" cy="400" r="9" fill="#2563eb"/>
    <text x="370" y="404" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
    <text x="390" y="404">Lädt das PGN in Gödelisierung und analysiert es automatisch</text>

    <circle cx="370" cy="424" r="9" fill="#2563eb"/>
    <text x="370" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
    <text x="390" y="428">Zeigt, wer die Urheberschaft dieser Stellung beansprucht hat</text>
  </g>
</svg>
